<!DOCTYPE html>
<html>
<head>
    <title>Deepa Mart - Sign Up</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #4169e1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 420px;
            background: white;
            padding: 35px 40px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        .brand {
            text-align: center;
            color: #4169e1;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .title {
            text-align: center;
            font-size: 25px;
            margin-bottom: 25px;
            color: #222;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            color: #555;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #4169e1;
        }

        .signup-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #087fce;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .signup-btn:hover {
            background: #066bb0;
        }

        .login-text {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #555;
        }

        .login-text a {
            color: #087fce;
            text-decoration: none;
            font-weight: bold;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 25px 0 18px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #ddd;
        }

        .divider span {
            padding: 0 12px;
            color: #999;
        }

        .social-btn {
            width: 100%;
            padding: 11px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: white;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="brand">DEEPA MART</div>

    <h2 class="title">Create Account</h2>

    <form action="signup" method="post">

        <label>Username</label>
        <input type="text"
               name="username"
               placeholder="Enter username"
               required>

        <label>Email</label>
        <input type="email"
               name="email"
               placeholder="Enter email"
               required>

        <label>Password</label>
        <input type="password"
               name="password"
               placeholder="Create password"
               required>

        <button type="submit" class="signup-btn">
            Sign Up
        </button>

    </form>

    <p class="login-text">
        Already have an account?
        <a href="login.html">Login</a>
    </p>

    <div class="divider">
        <span>Or</span>

</body>
</html>
